<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đọc truyện · thỏ ăn cỏ</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Itim&family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    /* font bảo mật do build.py tạo ra */
    @font-face{font-family:"SecuredFont";src:url("fonts/secure-font.woff2") format("woff2");font-display:block}
    :root{
      --brown:#7d5d52;--brown-d:#5a403a;--cream:#fff6ee;--paper:#fdf1e6;
      --pink:#f7d8d8;--pink-d:#e3a1a1;--line:#c8a89b;--text:#4a3530;
      --bg:#fbeee8;--card:#fffaf5;
      --font-body:"Quicksand",system-ui,sans-serif;--font-hand:"Itim","Quicksand",cursive;
    }
    body.dark{--bg:#241d1b;--card:#2f2624;--paper:#2f2624;--text:#e8d9d2;--line:#5a4640;--pink:#4a3434;--cream:#2f2624;--brown-d:#e8c9bd}
    *{box-sizing:border-box}
    body{
      margin:0;font-family:var(--font-body);color:var(--text);background:var(--bg);line-height:1.6;
      padding:0 max(14px,env(safe-area-inset-left,0px)) 40px max(14px,env(safe-area-inset-left,0px));
      -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
    }
    a{color:inherit}
    .wrap{max-width:760px;margin:0 auto}
    .top{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:14px 0}
    .btn{
      font-family:var(--font-hand);font-size:15px;text-decoration:none;cursor:pointer;
      background:var(--pink);color:var(--brown-d);border:2px dashed var(--brown);border-radius:999px;padding:3px 14px;
    }
    .btn:hover{filter:brightness(1.05)}
    .btn[aria-disabled="true"]{opacity:.4;pointer-events:none}
    .tools{display:flex;gap:6px;flex-wrap:wrap}
    .story-name{margin:2px 0 0;font-family:var(--font-hand);font-size:clamp(20px,5vw,28px);color:var(--brown)}
    body.dark .story-name{color:#e3a1a1}
    #story-card{
      background:var(--card);border:2px solid var(--line);border-radius:12px;
      padding:clamp(14px,4vw,28px);margin:10px 0;
    }
    #chapter-title{margin:0 0 14px;font-family:var(--font-hand);font-weight:400;font-size:clamp(22px,5vw,30px);color:var(--brown)}
    body.dark #chapter-title{color:#e3a1a1}
    .nav{display:flex;justify-content:space-between;gap:8px;margin:12px 0}
    .toc a{
      display:block;text-decoration:none;padding:9px 12px;border-bottom:1px dashed var(--line);
    }
    .toc a:hover{background:var(--pink)}
    .toc a.current{font-weight:700;background:var(--pink)}
    .muted{color:#a98d84;font-size:.9rem}
    noscript{display:block;padding:20px;text-align:center}
  </style>
</head>
<body>
<script src="age-gate.js"></script>
<div class="wrap">
  <div class="top">
    <a class="btn" href="index.html">🏠 trang chủ</a>
    <div class="tools">
      <a class="btn" id="btn-toc" href="#">📑 mục lục</a>
      <button class="btn" id="btn-smaller" type="button" aria-label="Giảm cỡ chữ">A−</button>
      <button class="btn" id="btn-bigger" type="button" aria-label="Tăng cỡ chữ">A+</button>
      <button class="btn" id="btn-dark" type="button" aria-label="Đổi nền sáng tối">🌙</button>
    </div>
  </div>

  <p class="story-name" id="story-name"></p>

  <!-- Chế độ đọc chương -->
  <section id="reader" hidden>
    <div id="story-card">
      <h1 id="chapter-title"></h1>
      <!-- Nội dung chương được nạp vào "closed shadow root" ở đây -->
      <div id="secure-shadow-root"></div>
    </div>
    <div class="nav">
      <a class="btn" id="btn-prev" href="#">← chương trước</a>
      <a class="btn" id="btn-next" href="#">chương sau →</a>
    </div>
  </section>

  <!-- Chế độ xem mục lục -->
  <section id="toc-view" hidden>
    <div id="story-card-toc" class="toc" style="background:var(--card);border:2px solid var(--line);border-radius:12px;padding:8px 6px"></div>
  </section>

  <p class="muted" id="message" hidden></p>
  <noscript>Trang cần bật JavaScript để đọc truyện.</noscript>
</div>

<script>
(function () {
  "use strict";
  var $ = function (s) { return document.querySelector(s); };
  var params = new URLSearchParams(location.search);
  var SAFE = /^[A-Za-z0-9_-]+$/;
  var STORY = params.get("story") || "";
  var CHAPTER = params.get("chapter") || "";

  var chapters = [];
  var storyTitle = "";
  var fontSize = 18;
  try { fontSize = parseInt(localStorage.getItem("tac-font"), 10) || 18; } catch (e) {}
  var shadow = null;

  function say(text) {
    var m = $("#message"); m.textContent = text; m.hidden = false;
  }

  /* ---------- nền tối ---------- */
  try { if (localStorage.getItem("tac-dark") === "1") document.body.classList.add("dark"); } catch (e) {}
  $("#btn-dark").addEventListener("click", function () {
    var on = document.body.classList.toggle("dark");
    try { localStorage.setItem("tac-dark", on ? "1" : "0"); } catch (e) {}
  });

  /* ---------- cỡ chữ ---------- */
  function applyFont() {
    if (!shadow) return;
    var c = shadow.getElementById("story-content");
    if (c) c.style.fontSize = fontSize + "px";
  }
  $("#btn-smaller").addEventListener("click", function () {
    fontSize = Math.max(14, fontSize - 1); save(); applyFont();
  });
  $("#btn-bigger").addEventListener("click", function () {
    fontSize = Math.min(30, fontSize + 1); save(); applyFont();
  });
  function save() { try { localStorage.setItem("tac-font", String(fontSize)); } catch (e) {} }

  /* ---------- danh sách chương (list.txt, định dạng "id: tiêu đề") ---------- */
  function loadList() {
    return fetch(STORY + "/list.txt", { cache: "no-cache" }).then(function (r) {
      if (!r.ok) throw new Error("Chưa có danh sách chương");
      return r.text();
    }).then(function (text) {
      chapters = [];
      text.split(/\r?\n/).forEach(function (line) {
        line = line.trim();
        if (!line) return;
        if (line.indexOf("# ") === 0) { storyTitle = line.slice(2).trim(); return; }
        var i = line.indexOf(":");
        if (i > 0) chapters.push({ id: line.slice(0, i).trim(), title: line.slice(i + 1).trim() });
      });
    });
  }

  function link(id) {
    return "doc.html?story=" + encodeURIComponent(STORY) + "&chapter=" + encodeURIComponent(id);
  }

  function showToc() {
    var box = $("#story-card-toc");
    box.textContent = "";
    if (!chapters.length) { say("Truyện này chưa có chương nào."); return; }
    chapters.forEach(function (ch) {
      var a = document.createElement("a");
      a.href = link(ch.id);
      a.textContent = ch.title;
      if (ch.id === CHAPTER) a.className = "current";
      box.appendChild(a);
    });
    $("#toc-view").hidden = false;
  }

  /* ---------- đọc chương ---------- */
  function showChapter() {
    return fetch(STORY + "/" + CHAPTER + ".txt", { cache: "no-cache" }).then(function (r) {
      if (!r.ok) throw new Error("Chương này chưa có.");
      return r.text();
    }).then(function (plain) {
      var blocks = plain.replace(/\r/g, "").split(/\n\s*\n/);
      var title = "";
      var paras = [];
      blocks.forEach(function (b) {
        var t = b.trim();
        if (!t) return;
        if (!title && t.indexOf("# ") === 0) { title = t.slice(2).split("\n")[0].trim(); t = t.split("\n").slice(1).join("\n").trim(); if (!t) return; }
        paras.push(t);
      });

      var idx = chapters.findIndex(function (c) { return c.id === CHAPTER; });
      if (!title && idx >= 0) title = chapters[idx].title;
      $("#chapter-title").textContent = title || CHAPTER;
      document.title = (title || "Đọc truyện") + " · thỏ ăn cỏ";

      // "closed" shadow root: mã trên trang không truy cập được vào nội dung bên trong
      var host = $("#secure-shadow-root");
      host.textContent = "";
      shadow = host.attachShadow({ mode: "closed" });

      var style = document.createElement("style");
      style.textContent =
        "#story-content{font-family:'SecuredFont',serif;line-height:1.9;color:inherit;font-size:" + fontSize + "px}" +
        ".p{margin:0 0 1rem;white-space:pre-line;word-break:break-word}";
      shadow.appendChild(style);

      var content = document.createElement("div");
      content.id = "story-content";
      paras.forEach(function (p) {
        var d = document.createElement("div");
        d.className = "p";
        d.textContent = p;        // textContent: không chèn mã HTML nên an toàn
        content.appendChild(d);
      });
      shadow.appendChild(content);

      $("#reader").hidden = false;
      try { localStorage.setItem("last_read_" + STORY, CHAPTER); } catch (e) {}

      var prev = $("#btn-prev"), next = $("#btn-next");
      if (idx > 0) { prev.href = link(chapters[idx - 1].id); } else { prev.setAttribute("aria-disabled", "true"); }
      if (idx >= 0 && idx < chapters.length - 1) { next.href = link(chapters[idx + 1].id); } else { next.setAttribute("aria-disabled", "true"); }
      window.scrollTo(0, 0);
    });
  }

  /* ---------- chống sao chép ---------- */
  var WEIRD = "aàảãáạăằẳẵắặâầẩẫấậbcdđeèẻẽéẹêềểễếệghiìỉĩíịklmnoòỏõóọôồổỗốộơờởỡớợpqrstuùủũúụưừửữứựvxyỳỷỹýỵz";
  function scramble(text) {
    return Array.from(text).map(function (ch) {
      if (ch === " ") {
        var r = Math.random();
        if (r < 0.15) return " ‌";
        if (r < 0.30) return " ​";
        return " ";
      }
      if (ch === "\n" || ch === "\r") return ch;
      if (/[.,!?;:()"'“”‘’]/.test(ch)) return ch;
      if (Math.random() < 0.8) {
        var c = WEIRD[Math.floor(Math.random() * WEIRD.length)];
        c = Math.random() < 0.5 ? c.toUpperCase() : c.toLowerCase();
        if (Math.random() < 0.2) c += "‌";
        return c;
      }
      return ch;
    }).join("");
  }

  document.addEventListener("copy", function (e) {
    var sel = window.getSelection();
    var card = $("#story-card");
    if (!sel || !sel.rangeCount || !card) return;
    var range = sel.getRangeAt(0);
    var text = sel.toString();
    if (text && card.contains(range.commonAncestorContainer)) {
      e.preventDefault();
      if (e.clipboardData) {
        var bad = scramble(text);
        e.clipboardData.setData("text/plain", bad);
        e.clipboardData.setData("text/html", bad);
      }
    }
  });
  ["cut", "contextmenu", "dragstart"].forEach(function (ev) {
    document.addEventListener(ev, function (e) { e.preventDefault(); });
  });
  document.addEventListener("keydown", function (e) {
    var k = (e.key || "").toLowerCase();
    if ((e.ctrlKey || e.metaKey) && (k === "x" || k === "s" || k === "u" || k === "p")) e.preventDefault();
    if (e.key === "F12") e.preventDefault();
  });

  /* ---------- khởi động ---------- */
  if (!STORY || !SAFE.test(STORY) || (CHAPTER && !SAFE.test(CHAPTER))) {
    say("Đường dẫn chưa đúng. Hãy quay lại trang chủ và chọn truyện.");
    return;
  }
  $("#btn-toc").href = "doc.html?story=" + encodeURIComponent(STORY);

  loadList().catch(function () { chapters = []; }).then(function () {
    $("#story-name").textContent = storyTitle || "";
    if (!CHAPTER) {
      document.title = (storyTitle || "Mục lục") + " · thỏ ăn cỏ";
      showToc();
      return;
    }
    return showChapter();
  }).catch(function (err) { say(err.message || "Không tải được chương."); });
})();
</script>
</body>
</html>

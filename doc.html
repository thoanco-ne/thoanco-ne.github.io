<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thỏ Ăn Cỏ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="theme.js"></script>
</head>
<body class="reading">
<div class="wrap">
  <nav class="bar">
    <a class="btn" href="index.html">Trang chủ</a>
    <a class="btn" id="btn-toc" href="#">Mục lục</a>
  </nav>
  <p class="story-name" id="story-name"></p>

  <section id="reader" hidden>
    <article class="page" id="story-card">
      <div class="page-inner">
        <h1 id="chapter-title"></h1>
        <div id="secure-shadow-root"></div>
      </div>
    </article>
    <div class="pager">
      <a class="btn" id="btn-prev" href="#">‹ Chương trước</a>
      <a class="btn" id="btn-next" href="#">Chương sau ›</a>
    </div>
  </section>

  <section id="toc-view" hidden><div class="toc" id="toc"></div></section>
  <p class="muted" id="message" hidden></p>
</div>

<!-- Bảng bình luận và cảm xúc cho từng đoạn -->
<div class="psheet" id="psheet" hidden>
  <div class="ps-box" role="dialog" aria-modal="true" aria-labelledby="ps-title">
    <div class="ps-head">
      <h3 id="ps-title">Đoạn 1</h3>
      <button class="ps-x" id="ps-close" type="button" aria-label="Đóng">✕</button>
    </div>
    <div class="ps-body">
      <div class="ps-react" id="ps-react"></div>
      <p class="ps-quote" id="ps-quote"></p>
      <div class="ps-label" id="ps-count">Bình luận</div>
      <div id="ps-list"></div>
    </div>
    <form class="ps-form" id="ps-form" autocomplete="off">
      <div class="ps-row">
        <input id="ps-name" type="text" maxlength="30" placeholder="Tên (không bắt buộc)" aria-label="Tên của bạn">
        <button class="ps-send" id="ps-send" type="submit">Gửi</button>
      </div>
      <textarea id="ps-body" maxlength="500" rows="2" placeholder="Viết bình luận…" aria-label="Bình luận"></textarea>
      <input id="ps-site" class="chp" type="text" tabindex="-1" autocomplete="off" aria-hidden="true">
      <p class="ps-status" id="ps-status" role="status"></p>
    </form>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="config.js"></script>
<script src="comments-core.js"></script>
<script src="reader.js"></script>
</body>
</html>
